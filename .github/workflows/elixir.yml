name: Elixir CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: elixir-vibe/actions/.github/workflows/elixir-rustler-ci.yml@v1
    with:
      latest-elixir: "1.19"
      latest-otp: "27"
      min-elixir: "1.15"
      min-otp: "26"
      rust-toolchain: "1.95.0"
      rust-cache-workspaces: native/laughter_nif -> target
      extra-env: LAUGHTER_BUILD=1
      # RustQ is development-only and requires Elixir 1.19.
      min-command: env MIX_ENV=prod mix compile --warnings-as-errors
      latest-command: >-
        env MIX_ENV=dev mix ci &&
        env MIX_ENV=dev mix docs --warnings-as-errors &&
        cargo clippy --manifest-path native/laughter_nif/Cargo.toml --locked -- -D warnings
